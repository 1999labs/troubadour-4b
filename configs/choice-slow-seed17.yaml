model: mlx-community/Qwen3-4B-Instruct-2507-4bit
train: true
fine_tune_type: lora
data: data/choice
seed: 17
num_layers: 8
batch_size: 2
grad_accumulation_steps: 4
iters: 3000
val_batches: -1
learning_rate: 0.000005
lr_schedule:
  name: cosine_decay
  arguments: [0.000005, 750, 0.000001]
  warmup: 25
  warmup_init: 0.0000001
steps_per_report: 20
steps_per_eval: 300
save_every: 50
adapter_path: artifacts/choice-slow-seed17
max_seq_length: 512
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  rank: 8
  dropout: 0.0
  scale: 16.0
